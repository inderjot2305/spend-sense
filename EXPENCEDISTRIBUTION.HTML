<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Distribution</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 20px;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        label {
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #28a745;
            color: white;
            padding: 10px;
            border: none;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Expense Distribution</h2>
        <form action="submit_expense.php" method="post">
            <label for="total amount paid on education">total amount paid on education:</label>
            <input type="number" id="education" name="education" placeholder="Enter amount" required>

            <label for="health">Health:</label>
            <input type="number" id="health" name="health" placeholder="Enter amount" required>

            <label for="fitness">Fitness:</label>
            <input type="number" id="fitness" name="fitness" placeholder="Enter amount" required>

            <label for="grocery">Grocery:</label>
            <input type="number" id="grocery" name="grocery" placeholder="Enter amount" required>

            <label for="internet">Internet:</label>
            <input type="number" id="internet" name="internet" placeholder="Enter amount" required>

            <label for="lpg">LPG:</label>
            <input type="number" id="lpg" name="lpg" placeholder="Enter amount" required>

            <label for="electricity">Electricity:</label>
            <input type="number" id="electricity" name="electricity" placeholder="Enter amount" required>

            <label for="rent">Rent/EMI:</label>
            <input id="rent" name="rent" placeholder="Enter amount" required>

            <label for="social_media">Social Media Subscription:</label>
            <input id="social_media" name="social_media" placeholder="Enter amount" required>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
